[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcontrol"
version = "0.1.0"
description = "Machine-learning controller design demos built on python-control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "control>=0.10",
    "numpy>=1.24",
    "scipy>=1.10",
    "plotly>=5.9",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mlcontrol = "mlcontrol.cli:main"

[tool.setuptools.packages.find]
include = ["mlcontrol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
